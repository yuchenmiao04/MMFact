model:
  vision_backbone: vit
  name: FND-CLIP
  parameters:
    text:
      encoder_preset: bert
      freeze: true
      max_length: 300
      output: cls_layers
    image:
      encoder_preset: resnet
      output: logits
      freeze: false
      center_crop: true
      stem_maxpool: true
    clip_text:
      encoder_preset: clip
      freeze: true
      max_length: 77
      normalize: false
    clip_image:
      encoder_preset: clip
      freeze: true
      normalize: false
    projection_hidden: 256
    feature_dim: 64
    classifier_hidden: 64
    dropout: 0.5
    normalization_epsilon: 1.0e-06
  provenance:
    paper: https://arxiv.org/abs/2205.14304v1
    code: https://github.com/zhouyangming/FND-CLIP-Fake-News-Detection/tree/ec60b226fb3621947a1e26da890cc0ebe128be42
training:
  seeds:
  - 0
  - 42
  - 2026
  epochs: 50
  batch_size: 64
  eval_batch_size: 64
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: adam
  optimizer_parameters: {}
  parameter_groups: {}
  weight_decay_exclude_bias_norm: false
  patience: 8
  device: auto
  gradient_clip_norm: null
  gradient_accumulation_steps: 1
  precision: full
  scheduler: null
  stage_overrides: {}
dataset_overrides:
  weibo17:
    model:
      parameters:
        clip_text:
          max_length: 52
    training:
      learning_rate: 0.0002
  weibo21:
    model:
      parameters:
        clip_text:
          max_length: 52
